<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>
    <!-- Bootstrap 5.3 CSS CDN -->
    <link href="https://jsdelivr.net..." rel="stylesheet">
    <!-- Bootstrap Icons CDN -->
    <link href="https://jsdelivr.net" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container my-5">
    <h1 class="h3 mb-4"><i class="bi bi-cart3 me-2"></i>Your Shopping Cart</h1>
    
    <div class="row g-4">
        <!-- Cart Items Column -->
        <div class="col-lg-8">
            
            <!-- Item 1 -->
            <div class="card shadow-sm mb-3">
                <div class="card-body">
                    <div class="row align-items-center">
                        <div class="col-md-2 col-4">
                            <img src="https://placeholder.com" alt="Product Image" class="img-fluid rounded">
                        </div>
                        <div class="col-md-4 col-8">
                            <h5 class="card-title mb-1 fs-6">Wireless Headphones</h5>
                            <p class="text-muted small mb-0">Color: Matte Black</p>
                        </div>
                        <div class="col-md-3 col-6 mt-3 mt-md-0">
                            <div class="input-group input-group-sm">
                                <button class="btn btn-outline-secondary" type="button">-</button>
                                <input type="text" class="form-control text-center" value="1" style="max-width: 50px;">
                                <button class="btn btn-outline-secondary" type="button">+</button>
                            </div>
                        </div>
                        <div class="col-md-2 col-4 mt-3 mt-md-0 text-md-end">
                            <span class="fw-bold">$99.00</span>
                        </div>
                        <div class="col-md-1 col-2 mt-3 mt-md-0 text-end">
                            <button class="btn btn-sm btn-outline-danger" title="Remove item">
                                <i class="bi bi-trash"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Item 2 -->
            <div class="card shadow-sm mb-3">
                <div class="card-body">
                    <div class="row align-items-center">
                        <div class="col-md-2 col-4">
                            <img src="https://placeholder.com" alt="Product Image" class="img-fluid rounded">
                        </div>
                        <div class="col-md-4 col-8">
                            <h5 class="card-title mb-1 fs-6">Ergonomic Mouse</h5>
                            <p class="text-muted small mb-0">Type: Wireless</p>
                        </div>
                        <div class="col-md-3 col-6 mt-3 mt-md-0">
                            <div class="input-group input-group-sm">
                                <button class="btn btn-outline-secondary" type="button">-</button>
                                <input type="text" class="form-control text-center" value="2" style="max-width: 50px;">
                                <button class="btn btn-outline-secondary" type="button">+</button>
                            </div>
                        </div>
                        <div class="col-md-2 col-4 mt-3 mt-md-0 text-md-end">
                            <span class="fw-bold">$45.00</span>
                        </div>
                        <div class="col-md-1 col-2 mt-3 mt-md-0 text-end">
                            <button class="btn btn-sm btn-outline-danger" title="Remove item">
                                <i class="bi bi-trash"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Back to shopping -->
            <div class="mt-4">
                <a href="#" class="btn btn-link text-decoration-none p-0 text-dark">
                    <i class="bi bi-arrow-left me-2"></i>Continue Shopping
                </a>
            </div>
        </div>

        <!-- Order Summary Column -->
        <div class="col-lg-4">
            <div class="card shadow-sm border-0">
                <div class="card-body">
                    <h5 class="card-title mb-4">Order Summary</h5>
                    
                    <div class="d-flex justify-content-between mb-2">
                        <span class="text-muted">Subtotal</span>
                        <span class="fw-semibold">$189.00</span>
                    </div>
                    
                    <div class="d-flex justify-content-between mb-2">
                        <span class="text-muted">Estimated Shipping</span>
                        <span class="text-success fw-semibold">Free</span>
                    </div>
                    
                    <div class="d-flex justify-content-between mb-3">
                        <span class="text-muted">Tax</span>
                        <span class="fw-semibold">$15.12</span>
                    </div>
                    
                    <hr>
                    
                    <div class="d-flex justify-content-between mb-4">
                        <span class="fs-5 fw-bold">Total</span>
                        <span class="fs-5 fw-bold">$204.12</span>
                    </div>

                    <!-- Promo Code Accordion -->
                    <div class="accordion accordion-flush mb-4" id="promoAccordion">
                        <div class="accordion-item bg-transparent">
                            <h2 class="accordion-header">
                                <button class="accordion-button collapsed p-0 bg-transparent shadow-none small text-primary" type="button" data-bs-toggle="collapse" data-bs-target="#promoCollapse">
                                    Have a promo code?
                                </button>
                            </h2>
                            <div id="promoCollapse" class="accordion-collapse collapse" data-bs-parent="#promoAccordion">
                                <div class="accordion-body p-0 pt-2">
                                    <div class="input-group">
                                        <input type="text" class="form-control form-control-sm" placeholder="Enter code">
                                        <button class="btn btn-sm btn-dark" type="button">Apply</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <button class="btn btn-primary w-100 py-2 fw-bold">
                        Proceed to Checkout<i class="bi bi-arrow-right ms-2"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap 5.3 JS Bundle CDN -->
<script src="https://jsdelivr.net"></script>
</body>
</html>
