Student Registration Form
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Registration Form</title>
</head>
<body>
<h2 align="center"> Student Registration Form</h2>
<form>
<label>Full Name:</label><br>
<input type="text" name="Full Name" placeholder="enter your Full Name"><br><br>
<label>E-mail:</label><br>
<input type="E-mail" name="E-mail" placeholder="enter your E-mail"><br><br>
<label>Password:</label><br>
<input type="Password" name="Password" placeholder="enter Password"><br><br>
<label>Mobile Number:</label><br>
<input type="tel" name="Mobile" placeholder="enter Mobile Number"><br><br>
<label>Date Of Birth:</label><br>
<input type="Date" name="DOB"><br><br>
<label>Gender:</label><br>
<input type="radio" name="gender" value="Male"> Male
<input type="radio" name="female" value="Female">Female
<input type="radio" name="other" value="Other">Other<br><br>
<label>Course:</label><br>
<select name="Course">
<option>Select Course</option>
<option>B.Tech</option>
<option>B.Sc</option>
<option>BCA</option>
<option>MCA</option>
<option>M.Tech</option>
</select><br><br>
<label>Skills</label><br>
<input type="checkbox">HTML
<input type="checkbox">CSS
<input type="checkbox">JavaScript
<input type="checkbox">Node.js<br><br>
<label>Address:</label><br>
<textarea rows="4" cols="40" placeholder="Enter your Address"></textarea><br><br>
<input type="submit" value="Register">
<input type="reset" value="Clear">
</form>
</body>
</html>
